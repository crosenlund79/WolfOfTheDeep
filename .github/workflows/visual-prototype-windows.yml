# Builds the portable Windows x64 package of Wolf of the Deep: Bathtub Edition
# (experiment, branch claude/bathtub-edition). Run on request (workflow_dispatch).
# Approved by the user for this experiment's playtest build; produces a
# downloadable workflow artifact only (no release publishing, no installer).
name: Wolf of the Deep · Bathtub Edition · Windows x64 build

on:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  windows-x64:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot editor and export templates
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-stable-linux

      - name: Download Godot ${{ env.GODOT_VERSION }} and export templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          curl -sSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          curl -sSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Import project
        run: ~/godot/godot --headless --path . --import

      - name: Launch smoke check (headless, 150 frames)
        run: |
          timeout 180 ~/godot/godot --headless --path . --quit-after 150 2>&1 | tee smoke.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error" smoke.log; then exit 1; fi

      - name: Practical checks (bathtub battle, economy, rivals and poker, flow and files; shared card engine and sound library)
        run: |
          timeout 300 ~/godot/godot --headless --path . --fixed-fps 30 -s tests/check_tub_battle.gd 2>&1 | tee checks.log
          timeout 300 ~/godot/godot --headless --path . -s tests/check_tub_economy.gd 2>&1 | tee -a checks.log
          timeout 300 ~/godot/godot --headless --path . --fixed-fps 30 -s tests/check_tub_rivals.gd 2>&1 | tee -a checks.log
          timeout 300 ~/godot/godot --headless --path . --fixed-fps 30 -s tests/check_tub_flow.gd 2>&1 | tee -a checks.log
          timeout 300 ~/godot/godot --headless --path . -s tests/check_poker.gd 2>&1 | tee -a checks.log
          timeout 120 ~/godot/godot --headless --path . -s tests/check_audio.gd 2>&1 | tee -a checks.log
          # One check per line: under "bash -e" only the last command of an
          # "a && b" list stops the step, so each result is tested on its own.
          grep "CHECK:" checks.log
          for c in "TUB BATTLE" "TUB ECONOMY" "TUB RIVALS" "TUB FLOW" "POKER" "AUDIO"; do
            grep -q "^$c CHECK: PASS" checks.log || { echo "missing: $c CHECK: PASS"; exit 1; }
          done

      - name: Export Windows x64 (portable, single executable)
        run: |
          set -euo pipefail
          out=build/WolfOfTheDeepBathtub
          mkdir -p "$out"
          ~/godot/godot --headless --path . --export-release "Windows Desktop" "$out/WolfOfTheDeepBathtub.exe"
          test -s "$out/WolfOfTheDeepBathtub.exe"
          cp docs/BATHTUB.md "$out/README.md"
          # External folders for the player's own pictures and sounds (read at startup, no rebuild).
          mkdir -p "$out/custom/graphics/bathtub" "$out/custom/audio/bathtub"
          echo "Put PNG pictures here, named as listed in README.md (Replacing art and sounds). Restart the game to see them." > "$out/custom/graphics/bathtub/PUT_YOUR_PICTURES_HERE.txt"
          echo "Put OGG, WAV or MP3 sounds here, named as listed in README.md (Replacing art and sounds). Restart the game to hear them." > "$out/custom/audio/bathtub/PUT_YOUR_SOUNDS_HERE.txt"
          ls -laR "$out"

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: WolfOfTheDeep-BathtubEdition-windows-x64
          path: build/WolfOfTheDeepBathtub
          if-no-files-found: error
          retention-days: 30
