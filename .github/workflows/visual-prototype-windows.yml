# Builds the portable Windows x64 package of Wolf of the Deep
# Mission 005 "The Living Arctic" (branch claude/mission-005-living-arctic).
# Run on request (workflow_dispatch) at the agreed checkpoints.
# Approved by the user for these playtest builds; produces a downloadable
# workflow artifact only (no release publishing, no installer).
name: Wolf of the Deep · Mission 005 · Windows x64 build

on:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  windows-x64:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot editor and export templates
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-stable-linux

      - name: Download Godot ${{ env.GODOT_VERSION }} and export templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          curl -sSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          curl -sSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Import project
        run: ~/godot/godot --headless --path . --import

      - name: Launch smoke check (headless, 150 frames)
        run: |
          timeout 180 ~/godot/godot --headless --path . --quit-after 150 2>&1 | tee smoke.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error" smoke.log; then exit 1; fi

      - name: Practical checks (cards, sound, pause, control room, saves, UI, world, intelligence, conduct)
        run: |
          timeout 300 ~/godot/godot --headless --path . -s tests/check_poker.gd 2>&1 | tee checks.log
          timeout 120 ~/godot/godot --headless --path . -s tests/check_audio.gd 2>&1 | tee -a checks.log
          timeout 180 ~/godot/godot --headless --path . --fixed-fps 30 -s tests/check_pause.gd 2>&1 | tee -a checks.log
          timeout 300 ~/godot/godot --headless --path . --fixed-fps 30 -s tests/check_control_room.gd 2>&1 | tee -a checks.log
          timeout 300 ~/godot/godot --headless --path . --fixed-fps 30 -s tests/check_save.gd 2>&1 | tee -a checks.log
          timeout 300 ~/godot/godot --headless --path . --fixed-fps 30 -s tests/check_ui.gd 2>&1 | tee -a checks.log
          timeout 400 ~/godot/godot --headless --path . --fixed-fps 30 -s tests/check_world.gd 2>&1 | tee -a checks.log
          timeout 400 ~/godot/godot --headless --path . --fixed-fps 30 -s tests/check_intel.gd 2>&1 | tee -a checks.log
          timeout 400 ~/godot/godot --headless --path . --fixed-fps 30 -s tests/check_conduct.gd 2>&1 | tee -a checks.log
          # One check per line: under "bash -e" only the last command of an
          # "a && b" list stops the step, so each result is tested on its own.
          grep "CHECK:" checks.log
          for c in POKER AUDIO PAUSE "CONTROL ROOM" SAVE UI WORLD INTEL CONDUCT; do
            grep -q "$c CHECK: PASS" checks.log || { echo "missing: $c CHECK: PASS"; exit 1; }
          done

      - name: Export Windows x64 (portable, single executable)
        run: |
          set -euo pipefail
          mkdir -p build/WolfOfTheDeep
          ~/godot/godot --headless --path . --export-release "Windows Desktop" build/WolfOfTheDeep/WolfOfTheDeep.exe
          test -s build/WolfOfTheDeep/WolfOfTheDeep.exe
          cp docs/MISSION_005.md build/WolfOfTheDeep/README.md
          cp docs/AUDIO_LIBRARY.md build/WolfOfTheDeep/AUDIO_LIBRARY.md
          cp docs/CONTROL_ROOM_PILOT.md build/WolfOfTheDeep/README_CONTROL_ROOM_PILOT.md
          # External folder for user sound overrides (read at startup, no rebuild).
          mkdir -p build/WolfOfTheDeep/custom/audio
          cp docs/AUDIO_LIBRARY.md build/WolfOfTheDeep/custom/audio/PUT_YOUR_SOUNDS_HERE.txt
          ls -laR build/WolfOfTheDeep

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: WolfOfTheDeep-Mission005-LivingArctic-windows-x64
          path: build/WolfOfTheDeep
          if-no-files-found: error
          retention-days: 30
